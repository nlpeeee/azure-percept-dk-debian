# Debian 13 "trixie" on Debian's own arm64 kernel, booted through the launcher.
schema = 1
id = "debian-trixie"
title = "Debian 13 (trixie), stock Debian kernel"
status = "tested"          # verified on Percept DK board 1 with 6.12.113+deb13-arm64

[rootfs]
type = "debootstrap"
suite = "trixie"
mirror = "http://deb.debian.org/debian"
variant = "minbase"
components = ["main", "contrib", "non-free-firmware"]
include = [
  "systemd", "systemd-sysv", "dbus", "initramfs-tools", "kmod", "python3", "ca-certificates", "locales",
  "openssh-server", "sudo", "nano", "less", "curl", "wget", "iproute2", "iputils-ping",
  "systemd-resolved", "systemd-timesyncd", "e2fsprogs", "dosfstools", "fdisk", "cloud-guest-utils",
  "pciutils", "usbutils", "i2c-tools", "htop", "bash-completion", "zstd", "wpasupplicant",
]
builder = "qemu-user"
hooks = ["20-cpu-power.sh"]
min_size_mib = 2048

[kernel]
source = "distro"
package = "linux-image-arm64"
pin = "6.12.*"                     # apt pin: minor updates flow, a new major series does not
format = "Image"
require_initrd = true
validated_releases = ["6.12.113+deb13-arm64"]

# The CPU adaptation and initramfs ordering are qualified for this kernel series.
# The rootfs builder must pass resolved.rootfs_env to hooks with /src available.
[cpu_power]
kernels = ["6.12.*"]
config_required = ["MFD_ROHM_BD718XX", "REGULATOR_BD718XX", "ARM_IMX_CPUFREQ_DT", "CPUFREQ_DT", "CPU_FREQ_GOV_POWERSAVE", "CPU_FREQ_GOV_SCHEDUTIL", "CPU_THERMAL"]

[boot]
kernel_path = "/vmlinuz"           # Debian's own symlinks: kernel updates keep working
initrd_path = "/initrd.img"

[contract]
config_required = [
  "ARCH_MXC", "CLK_IMX8MQ", "PINCTRL_IMX8MQ", "IMX_GPCV2", "PCI_IMX6_HOST", "IGB",
  "MMC_SDHCI_ESDHC_IMX", "EXT4_FS", "RESET_IMX7", "I2C_IMX", "SERIAL_IMX", "NVMEM_IMX_OCOTP",
]
initramfs_modules = ["imx2_wdt", "sdhci-esdhc-imx", "ext4"]
cmdline_baseline = "console=ttymxc0,115200 earlycon=ec_imx6q,0x30860000 cpuidle.off=1 clk_ignore_unused pd_ignore_unused efi=noruntime net.ifnames=0 module_blacklist=rohm_bd718x7,bd718x7_regulator,imx_cpufreq_dt cma=256M"

[features]
gpu = { default = true }
vpu = { default = true, requires = ["gpu"] }
usb_c_host = { default = true }
camera = { default = false }
upper_ram = { default = true }
thermal = { default = true }

# Device-tree fixups: valid for mainline 6.12 bindings only. They are chosen at
# build time from the kernel release and written to the launcher config.
[[fixup]]
name = "upper-ram"
kernels = ["6.12.*"]
feature = "upper_ram"

[[fixup]]
name = "thermal"
kernels = ["6.12.*"]
feature = "thermal"

[[fixup]]
name = "media-gpu"
kernels = ["6.12.*"]
when = { gpu = true, vpu = false }

[[fixup]]
name = "media-gpu-vpu"
kernels = ["6.12.*"]
when = { gpu = true, vpu = true }

[[fixup]]
name = "usbc-extcon"
kernels = ["6.12.*"]
stage = "esp-dtb"
feature = "usb_c_host"
