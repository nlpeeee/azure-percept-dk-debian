# /etc/alsa/conf.d/50-percept-ear.conf
# Named PCMs for the Azure Percept Ear SoM (USB 045e:0671, card id "PerceptEar", set by
# 70-percept-ear.rules). The system default PCM is deliberately left alone.
#
# Capture channel map (5 ch, S32_LE, 16000 Hz only): ch0-3 = the four MEMS mics,
# ch4 = hardware playback reference (loopback).

# Raw device: all 5 channels, S32_LE, 16 kHz. For beamforming / the Microsoft Audio Stack.
pcm.percept_ear_raw {
    type hw
    card PerceptEar
    device 0
}

# The four microphones only (ch0-3), still raw format and rate.
pcm.percept_mics {
    type route
    slave {
        pcm "percept_ear_raw"
        channels 5
    }
    ttable {
        0.0 1
        1.1 1
        2.2 1
        3.3 1
    }
}

# Mono mix (average of ch0-3) with rate/format conversion, for ordinary applications.
pcm.percept_mic {
    type plug
    slave.pcm {
        type route
        slave {
            pcm "percept_ear_raw"
            channels 5
        }
        ttable {
            0.0 0.25
            0.1 0.25
            0.2 0.25
            0.3 0.25
        }
    }
}

# Playback to the 3.5 mm jack (2 ch, S32_LE, 16 kHz native) with rate/format conversion.
pcm.percept_speaker {
    type plug
    slave.pcm "hw:PerceptEar,0"
}
