# /etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf
# The FEC port (eth1) is not wired on the Percept DK, so waiting for every link
# fails after 2 minutes on every boot (a failed unit, and a 2 minute
# network-online.target). Only the Intel port (eth0) matters.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=eth0 --timeout=30
